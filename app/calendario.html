<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario — Tutor</title>
<link rel="stylesheet" href="assets/theme.css">
<style>
  .list{display:flex;flex-direction:column;gap:12px;}
  .event{
    background:var(--surface-card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px 18px;
    box-shadow: var(--shadow);
    display:flex;
    gap:14px;
    align-items:flex-start;
    transition: transform .2s cubic-bezier(.16,1,.3,1), border-color .2s ease;
  }
  .event:hover{transform:translateX(3px);border-color:var(--accent);}
  .event .date-badge{
    flex-shrink:0;
    width:52px;
    text-align:center;
    background:var(--surface-sunken);
    border-radius:var(--radius-sm);
    padding:8px 4px;
  }
  .event .date-badge .day{display:block;font-size:19px;font-weight:800;line-height:1;}
  .event .date-badge .mon{display:block;font-size:10.5px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.04em;margin-top:3px;}
  .event .body{flex:1;min-width:0;}
  .event h2{font-size:14.5px;margin:0 0 4px;font-weight:700;}
  .event .meta{font-size:12px;color:var(--ink-muted);margin-bottom:6px;}
  .event p{margin:0;font-size:13px;color:var(--ink-secondary);line-height:1.5;}
  .tag{
    display:inline-block;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.03em;
    text-transform:uppercase;
    padding:2px 8px;
    border-radius:999px;
    margin-left:8px;
    vertical-align:middle;
  }
  .tag.entrega{background:var(--warn-soft-bg);color:var(--warn-soft-ink);}
  .tag.parcial{background:var(--accent-soft-bg);color:var(--accent-soft-ink);}
  .tag.reunion{background:var(--surface-sunken);color:var(--ink-secondary);}

  .empty{color:var(--ink-muted);font-size:13px;text-align:center;padding:34px 10px;}
</style>
</head>
<body>
<div class="wrap narrow">

  <header>
    <div>
      <a class="menu-link" href="inicio.html">← Menú</a>
      <h1>📅 Calendario</h1>
      <p>Tu asistente académico</p>
    </div>
    <div class="header-right">
      <span class="check-badge">✓ Revisado <b>10 ago 2026</b></span>
      <button class="theme-toggle" id="btnTheme" type="button" aria-label="Cambiar tema claro/oscuro" title="Cambiar tema">🌙</button>
    </div>
  </header>

  <div class="list" id="lista"></div>

  <footer>Fechas del calendario UAN (campus virtual) + reuniones agregadas a mano. La fecha de "Revisado" es la última vez que se chequeó si había novedades — se actualiza cuando hablamos.</footer>
</div>

<script>
/* Entregas y parciales importados del calendario del campus virtual UAN.
   No incluir tokens/URLs de exportación acá: solo título, curso y fecha. */
const EVENTOS_UAN = [
  { titulo: 'Vencimiento de TallerExploracion.1', curso: 'Aplicaciones Móviles', descripcion: 'Taller 1 de Aplicaciones Móviles.', fecha: '2026-08-31T23:59:00-05:00', tipo: 'entrega' },
  { titulo: 'Se abre Parcial 1', descripcion: 'Apertura del primer parcial.', fecha: '2026-09-01T18:00:00-05:00', tipo: 'parcial' },
  { titulo: 'Se cierra Parcial 1', descripcion: 'Cierre del primer parcial.', fecha: '2026-09-01T23:59:00-05:00', tipo: 'parcial' },
  { titulo: 'Vencimiento de Taller 2', curso: 'Aplicaciones Móviles', descripcion: 'Taller 2 de Aplicaciones Móviles.', fecha: '2026-09-15T23:59:00-05:00', tipo: 'entrega' },
  { titulo: 'Vencimiento de Taller 3', descripcion: 'Taller 3.', fecha: '2026-09-24T23:59:00-05:00', tipo: 'entrega' },
  { titulo: 'Se abre Parcial 2', descripcion: 'Apertura del segundo parcial.', fecha: '2026-10-06T20:00:00-05:00', tipo: 'parcial' },
  { titulo: 'Se cierra Parcial 2', descripcion: 'Cierre del segundo parcial.', fecha: '2026-10-06T22:00:00-05:00', tipo: 'parcial' }
];

/* Reuniones u otras fechas relevantes agregadas a mano en el chat. */
const REUNIONES = [];

const TODOS = [...EVENTOS_UAN.map(e => ({ ...e, fuente: 'uan' })), ...REUNIONES.map(e => ({ ...e, fuente: 'reunion' }))]
  .filter(e => new Date(e.fecha) >= new Date(new Date().toDateString()))
  .sort((a, b) => new Date(a.fecha) - new Date(b.fecha));

const MESES = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
const lista = document.getElementById('lista');

if (TODOS.length === 0) {
  const p = document.createElement('p');
  p.className = 'empty';
  p.textContent = 'No hay fechas próximas cargadas todavía.';
  lista.appendChild(p);
} else {
  TODOS.forEach((ev, i) => {
    const d = new Date(ev.fecha);

    const card = document.createElement('div');
    card.className = 'event enter';
    card.style.animationDelay = (i * 45) + 'ms';

    const badge = document.createElement('div');
    badge.className = 'date-badge';
    const day = document.createElement('span');
    day.className = 'day';
    day.textContent = String(d.getDate()).padStart(2, '0');
    const mon = document.createElement('span');
    mon.className = 'mon';
    mon.textContent = MESES[d.getMonth()];
    badge.append(day, mon);

    const body = document.createElement('div');
    body.className = 'body';

    const h2 = document.createElement('h2');
    h2.textContent = ev.titulo;
    const tag = document.createElement('span');
    tag.className = 'tag ' + ev.tipo;
    tag.textContent = ev.tipo === 'entrega' ? 'Entrega' : ev.tipo === 'parcial' ? 'Parcial' : 'Reunión';
    h2.appendChild(tag);

    const meta = document.createElement('div');
    meta.className = 'meta';
    const hora = d.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
    meta.textContent = (ev.curso ? ev.curso + ' · ' : '') + hora;

    const desc = document.createElement('p');
    desc.textContent = ev.descripcion || '';

    body.append(h2, meta, desc);
    card.append(badge, body);
    lista.appendChild(card);
  });
}

/* ---------- Tema claro / oscuro (compartido con el resto del tutor) ---------- */
const rootEl = document.documentElement;
function tema() { return rootEl.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; }
function aplicarTema(t) {
  rootEl.setAttribute('data-theme', t);
  document.getElementById('btnTheme').textContent = t === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('tf_theme', t);
}
(function initTema() {
  const guardado = localStorage.getItem('tf_theme');
  const preferido = guardado || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  aplicarTema(preferido);
})();
document.getElementById('btnTheme').addEventListener('click', () => {
  aplicarTema(tema() === 'dark' ? 'light' : 'dark');
});
</script>
</body>
</html>
