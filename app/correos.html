<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Correos importantes — Tutor</title>
<style>
  :root{
    color-scheme: light;
    --surface-page:#f9f9f7;
    --surface-card:#fcfcfb;
    --surface-sunken:#f2f1ee;
    --ink:#0b0b0b;
    --ink-secondary:#52514e;
    --ink-muted:#898781;
    --gridline:#e1e0d9;
    --border:rgba(11,11,11,0.10);
    --accent:#2a78d6;
    --accent-ink:#ffffff;
    --accent-soft-bg:rgba(42,120,214,0.12);
    --accent-soft-ink:#1c5cab;
    --radius:14px;
    --shadow:0 1px 2px rgba(11,11,11,0.04), 0 8px 24px -16px rgba(11,11,11,0.18);
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --surface-page:#0d0d0d;
    --surface-card:#1a1a19;
    --surface-sunken:#141413;
    --ink:#ffffff;
    --ink-secondary:#c3c2b7;
    --ink-muted:#898781;
    --gridline:#2c2c2a;
    --border:rgba(255,255,255,0.10);
    --accent:#3987e5;
    --accent-ink:#ffffff;
    --accent-soft-bg:rgba(57,135,229,0.16);
    --accent-soft-ink:#8fc0ff;
    --shadow:0 1px 2px rgba(0,0,0,0.3), 0 12px 28px -18px rgba(0,0,0,0.6);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:var(--surface-page);
    color:var(--ink);
    padding:28px 20px 60px;
    transition: background .2s ease, color .2s ease;
  }
  .wrap{max-width:760px;margin:0 auto;}

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:24px;
    flex-wrap:wrap;
    gap:14px;
  }
  header h1{font-size:23px;margin:0;font-weight:700;letter-spacing:-.01em;}
  header p{margin:3px 0 0;color:var(--ink-secondary);font-size:13px;}
  .menu-link{display:inline-block;font-size:12.5px;font-weight:600;color:var(--ink-secondary);text-decoration:none;margin-bottom:6px;}
  .menu-link:hover{color:var(--accent);}
  .theme-toggle{
    width:36px;height:36px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--surface-card);
    color:var(--ink-secondary);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:16px;
    line-height:1;
  }
  .theme-toggle:hover{background:var(--surface-sunken);color:var(--ink);}
  .theme-toggle:focus-visible, a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .list{display:flex;flex-direction:column;gap:12px;}
  .mail{
    background:var(--surface-card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px 18px;
    box-shadow: var(--shadow);
    text-decoration:none;
    color:inherit;
    display:block;
  }
  .mail:hover{border-color:var(--accent);}
  .mail .meta{display:flex;justify-content:space-between;gap:10px;margin-bottom:5px;}
  .mail .remitente{font-size:12.5px;font-weight:700;color:var(--accent-soft-ink);}
  .mail .fecha{font-size:11.5px;color:var(--ink-muted);flex-shrink:0;}
  .mail h2{font-size:14.5px;margin:0 0 5px;font-weight:700;}
  .mail p{margin:0;font-size:13px;color:var(--ink-secondary);line-height:1.5;}

  .empty{color:var(--ink-muted);font-size:13px;text-align:center;padding:34px 10px;line-height:1.6;}
  footer{text-align:center;color:var(--ink-muted);font-size:12px;margin-top:32px;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <a class="menu-link" href="inicio.html">← Menú</a>
      <h1>📧 Correos importantes</h1>
      <p>Probabilidad y Estadística · 4to semestre</p>
    </div>
    <div class="header-right">
      <button class="theme-toggle" id="btnTheme" type="button" aria-label="Cambiar tema claro/oscuro" title="Cambiar tema">🌙</button>
    </div>
  </header>

  <div class="list" id="lista"></div>

  <footer>Selección manual: los vas marcando en el chat y se agregan acá.</footer>
</div>

<script>
/* Correos que el usuario marcó como importantes a mano durante el chat.
   Sin filtro automático — se agregan uno por uno cuando se conversa. */
const CORREOS = [];

const lista = document.getElementById('lista');

if (CORREOS.length === 0) {
  const p = document.createElement('p');
  p.className = 'empty';
  p.textContent = 'Todavía no hay correos marcados como importantes.\nDecímelos en el chat y los voy agregando acá.';
  lista.appendChild(p);
} else {
  CORREOS.forEach(c => {
    const a = document.createElement('a');
    a.className = 'mail';
    a.href = c.link || '#';
    if (c.link) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }

    const meta = document.createElement('div');
    meta.className = 'meta';
    const remitente = document.createElement('span');
    remitente.className = 'remitente';
    remitente.textContent = c.remitente;
    const fecha = document.createElement('span');
    fecha.className = 'fecha';
    fecha.textContent = c.fecha;
    meta.append(remitente, fecha);

    const h2 = document.createElement('h2');
    h2.textContent = c.asunto;

    const p = document.createElement('p');
    p.textContent = c.resumen || '';

    a.append(meta, h2, p);
    lista.appendChild(a);
  });
}

/* ---------- Tema claro / oscuro (compartido con el resto del tutor) ---------- */
const rootEl = document.documentElement;
function tema() { return rootEl.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }
function aplicarTema(t) {
  rootEl.setAttribute('data-theme', t);
  document.getElementById('btnTheme').textContent = t === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('tf_theme', t);
}
(function initTema() {
  const guardado = localStorage.getItem('tf_theme');
  const preferido = guardado || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  aplicarTema(preferido);
})();
document.getElementById('btnTheme').addEventListener('click', () => {
  aplicarTema(tema() === 'dark' ? 'light' : 'dark');
});
</script>
</body>
</html>
