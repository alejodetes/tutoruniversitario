<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Correos importantes — Tutor</title>
<link rel="stylesheet" href="assets/theme.css">
<style>
  .list{display:flex;flex-direction:column;gap:12px;}
  .mail{
    background:var(--surface-card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px 18px;
    box-shadow: var(--shadow);
    text-decoration:none;
    color:inherit;
    display:block;
    transition: transform .2s cubic-bezier(.16,1,.3,1), border-color .2s ease;
  }
  .mail:hover{border-color:var(--accent);transform:translateX(3px);}
  .mail .meta{display:flex;justify-content:space-between;gap:10px;margin-bottom:5px;}
  .mail .remitente{font-size:12.5px;font-weight:700;color:var(--accent-soft-ink);}
  .mail .fecha{font-size:11.5px;color:var(--ink-muted);flex-shrink:0;}
  .mail h2{font-size:14.5px;margin:0 0 5px;font-weight:700;}
  .mail p{margin:0;font-size:13px;color:var(--ink-secondary);line-height:1.5;}

  .empty{color:var(--ink-muted);font-size:13px;text-align:center;padding:34px 10px;line-height:1.6;white-space:pre-line;}
</style>
</head>
<body>
<div class="wrap narrow">

  <header>
    <div>
      <a class="menu-link" href="inicio.html">← Menú</a>
      <h1>📧 Correos importantes</h1>
      <p>Tu asistente académico</p>
    </div>
    <div class="header-right">
      <span class="check-badge">✓ Revisado <b>10 ago 2026</b></span>
      <button class="theme-toggle" id="btnTheme" type="button" aria-label="Cambiar tema claro/oscuro" title="Cambiar tema">🌙</button>
    </div>
  </header>

  <div class="list" id="lista"></div>

  <footer>Selección manual: los vas marcando en el chat y se agregan acá. La fecha de "Revisado" es la última vez que se chequeó el correo buscando algo importante.</footer>
</div>

<script>
/* Correos que el usuario marcó como importantes a mano durante el chat.
   Sin filtro automático — se agregan uno por uno cuando se conversa. */
const CORREOS = [
  {
    remitente: 'David Herrera (Prof. Ing. de Sistemas)',
    asunto: 'Audios Taller 10',
    fecha: '10 ago 2026',
    resumen: 'El profesor envió 5 archivos de audio para el Taller 10 (sin texto adicional en el cuerpo del correo). Revisar en Gmail para escucharlos y ver instrucciones.',
    link: 'https://mail.google.com/mail/u/0/#all/19fed82dad340a43'
  }
];

const lista = document.getElementById('lista');

if (CORREOS.length === 0) {
  const p = document.createElement('p');
  p.className = 'empty';
  p.textContent = 'Todavía no hay correos marcados como importantes.\nDecímelos en el chat y los voy agregando acá.';
  lista.appendChild(p);
} else {
  CORREOS.forEach((c, i) => {
    const a = document.createElement('a');
    a.className = 'mail enter';
    a.style.animationDelay = (i * 45) + 'ms';
    a.href = c.link || '#';
    if (c.link) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }

    const meta = document.createElement('div');
    meta.className = 'meta';
    const remitente = document.createElement('span');
    remitente.className = 'remitente';
    remitente.textContent = c.remitente;
    const fecha = document.createElement('span');
    fecha.className = 'fecha';
    fecha.textContent = c.fecha;
    meta.append(remitente, fecha);

    const h2 = document.createElement('h2');
    h2.textContent = c.asunto;

    const p = document.createElement('p');
    p.textContent = c.resumen || '';

    a.append(meta, h2, p);
    lista.appendChild(a);
  });
}

/* ---------- Tema claro / oscuro (compartido con el resto del tutor) ---------- */
const rootEl = document.documentElement;
function tema() { return rootEl.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; }
function aplicarTema(t) {
  rootEl.setAttribute('data-theme', t);
  document.getElementById('btnTheme').textContent = t === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('tf_theme', t);
}
(function initTema() {
  const guardado = localStorage.getItem('tf_theme');
  const preferido = guardado || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  aplicarTema(preferido);
})();
document.getElementById('btnTheme').addEventListener('click', () => {
  aplicarTema(tema() === 'dark' ? 'light' : 'dark');
});
</script>
</body>
</html>
