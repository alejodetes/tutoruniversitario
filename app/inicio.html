<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tutor — Probabilidad y Estadística</title>
<style>
  :root{
    color-scheme: light;
    --surface-page:#f9f9f7;
    --surface-card:#fcfcfb;
    --surface-sunken:#f2f1ee;
    --ink:#0b0b0b;
    --ink-secondary:#52514e;
    --ink-muted:#898781;
    --gridline:#e1e0d9;
    --border:rgba(11,11,11,0.10);
    --baseline:#c3c2b7;
    --accent:#2a78d6;
    --accent-ink:#ffffff;
    --accent-soft-bg:rgba(42,120,214,0.12);
    --accent-soft-ink:#1c5cab;
    --good-text:#006300;
    --radius:14px;
    --shadow:0 1px 2px rgba(11,11,11,0.04), 0 8px 24px -16px rgba(11,11,11,0.18);
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --surface-page:#0d0d0d;
    --surface-card:#1a1a19;
    --surface-sunken:#141413;
    --ink:#ffffff;
    --ink-secondary:#c3c2b7;
    --ink-muted:#898781;
    --gridline:#2c2c2a;
    --border:rgba(255,255,255,0.10);
    --baseline:#383835;
    --accent:#3987e5;
    --accent-ink:#ffffff;
    --accent-soft-bg:rgba(57,135,229,0.16);
    --accent-soft-ink:#8fc0ff;
    --good-text:#0ca30c;
    --shadow:0 1px 2px rgba(0,0,0,0.3), 0 12px 28px -18px rgba(0,0,0,0.6);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:var(--surface-page);
    color:var(--ink);
    padding:28px 20px 60px;
    transition: background .2s ease, color .2s ease;
  }
  .wrap{max-width:1120px;margin:0 auto;}

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:28px;
    flex-wrap:wrap;
    gap:14px;
  }
  header h1{font-size:23px;margin:0;font-weight:700;letter-spacing:-.01em;}
  header p{margin:3px 0 0;color:var(--ink-secondary);font-size:13px;}
  .header-right{display:flex;align-items:center;gap:10px;}
  .theme-toggle{
    width:36px;height:36px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--surface-card);
    color:var(--ink-secondary);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:16px;
    line-height:1;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .theme-toggle:hover{background:var(--surface-sunken);color:var(--ink);}
  .theme-toggle:focus-visible, a:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap:18px;
  }

  .tool-card{
    background:var(--surface-card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px;
    box-shadow: var(--shadow);
    text-decoration:none;
    color:inherit;
    display:flex;
    flex-direction:column;
    gap:8px;
    transition: transform .12s ease, border-color .15s ease;
  }
  .tool-card:hover{transform:translateY(-2px);border-color:var(--accent);}
  .tool-card .icon{font-size:26px;}
  .tool-card h2{font-size:15.5px;margin:0;font-weight:700;}
  .tool-card p{margin:0;font-size:13px;color:var(--ink-secondary);line-height:1.4;flex-grow:1;}
  .status{
    align-self:flex-start;
    font-size:11px;
    font-weight:700;
    letter-spacing:.03em;
    text-transform:uppercase;
    padding:3px 9px;
    border-radius:999px;
  }
  .status.disponible{background:var(--accent-soft-bg);color:var(--accent-soft-ink);}
  .status.proximamente{background:var(--surface-sunken);color:var(--ink-muted);}

  .tool-card.placeholder{
    border-style:dashed;
    box-shadow:none;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:var(--ink-muted);
    cursor:default;
  }
  .tool-card.placeholder:hover{transform:none;border-color:var(--border);}
  .tool-card.placeholder .icon{font-size:22px;opacity:.6;}
  .tool-card.placeholder p{font-size:12.5px;}

  footer{text-align:center;color:var(--ink-muted);font-size:12px;margin-top:36px;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>🎓 Tutor</h1>
      <p>Probabilidad y Estadística · 4to semestre</p>
    </div>
    <div class="header-right">
      <button class="theme-toggle" id="btnTheme" type="button" aria-label="Cambiar tema claro/oscuro" title="Cambiar tema">🌙</button>
    </div>
  </header>

  <div class="grid" id="grid"></div>

  <footer>Elegí una herramienta para empezar.</footer>
</div>

<script>
/* Cada herramienta nueva se agrega acá: icono, nombre, descripción, link y estado. */
const HERRAMIENTAS = [
  {
    icono: '📊',
    nombre: 'Tablas de Frecuencia',
    descripcion: 'Cargá tus datos y calculá fi, hi, hi%, Fi, Hi%, con gráficas de barras, histograma o pastel.',
    href: 'tablas_frecuencia.html',
    estado: 'disponible'
  }
];

const grid = document.getElementById('grid');

HERRAMIENTAS.forEach(h => {
  const a = document.createElement('a');
  a.className = 'tool-card';
  a.href = h.href;

  const icon = document.createElement('div');
  icon.className = 'icon';
  icon.textContent = h.icono;

  const title = document.createElement('h2');
  title.textContent = h.nombre;

  const desc = document.createElement('p');
  desc.textContent = h.descripcion;

  const status = document.createElement('span');
  status.className = 'status ' + h.estado;
  status.textContent = h.estado === 'disponible' ? 'Disponible' : 'Próximamente';

  a.append(icon, title, desc, status);
  grid.appendChild(a);
});

const placeholder = document.createElement('div');
placeholder.className = 'tool-card placeholder';
const pIcon = document.createElement('div');
pIcon.className = 'icon';
pIcon.textContent = '➕';
const pText = document.createElement('p');
pText.textContent = 'Acá van a aparecer nuevas herramientas a medida que se agreguen.';
placeholder.append(pIcon, pText);
grid.appendChild(placeholder);

/* ---------- Tema claro / oscuro ---------- */
const rootEl = document.documentElement;

function tema() {
  return rootEl.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
}
function aplicarTema(t) {
  rootEl.setAttribute('data-theme', t);
  document.getElementById('btnTheme').textContent = t === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('tf_theme', t);
}
(function initTema() {
  const guardado = localStorage.getItem('tf_theme');
  const preferido = guardado || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  aplicarTema(preferido);
})();
document.getElementById('btnTheme').addEventListener('click', () => {
  aplicarTema(tema() === 'dark' ? 'light' : 'dark');
});
</script>
</body>
</html>
