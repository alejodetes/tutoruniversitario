<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tutor — Probabilidad y Estadística</title>
<link rel="stylesheet" href="assets/theme.css">
<style>
  .grid{
    display:grid;
    grid-template-columns: 1fr;
    gap:16px;
  }
  @media (min-width:560px){ .grid{grid-template-columns: repeat(2, 1fr);} }
  @media (min-width:900px){ .grid{grid-template-columns: repeat(3, 1fr);} }
  @media (min-width:1180px){ .grid{grid-template-columns: repeat(4, 1fr);} }

  .tool-card{
    position:relative;
    background:var(--surface-card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:22px;
    box-shadow: var(--shadow);
    text-decoration:none;
    color:inherit;
    display:flex;
    flex-direction:column;
    gap:10px;
    overflow:hidden;
    transition: transform .22s cubic-bezier(.16,1,.3,1), box-shadow .22s ease, border-color .22s ease;
  }
  .tool-card:hover{transform:translateY(-4px) scale(1.01);border-color:var(--accent);}
  .tool-card:hover .avatar{transform:scale(1.08) rotate(-4deg);}
  .tool-card:active{transform:translateY(-1px) scale(.995);}

  .avatar{
    width:52px;height:52px;
    border-radius:16px;
    display:flex;align-items:center;justify-content:center;
    font-size:24px;
    flex-shrink:0;
    transition: transform .25s cubic-bezier(.16,1,.3,1);
  }
  .avatar.c1{background:linear-gradient(150deg, rgba(42,120,214,.35), rgba(42,120,214,.16));}
  .avatar.c2{background:linear-gradient(150deg, rgba(235,104,52,.38), rgba(235,104,52,.16));}
  .avatar.c3{background:linear-gradient(150deg, rgba(27,175,122,.38), rgba(27,175,122,.16));}
  .avatar.c4{background:linear-gradient(150deg, rgba(232,147,90,.4), rgba(232,147,90,.16));}

  .tool-card h2{font-size:16px;margin:2px 0 0;font-weight:800;letter-spacing:-.005em;}
  .tool-card p{margin:0;font-size:13.5px;color:var(--ink-secondary);line-height:1.5;flex-grow:1;}
  .status{
    align-self:flex-start;
    font-size:11px;
    font-weight:700;
    letter-spacing:.03em;
    text-transform:uppercase;
    padding:4px 10px;
    border-radius:999px;
  }
  .status.disponible{background:var(--accent-soft-bg);color:var(--accent-soft-ink);}
  .status.proximamente{background:var(--surface-sunken);color:var(--ink-muted);}

  .tool-card.placeholder{
    border-style:dashed;
    box-shadow:none;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:var(--ink-muted);
    cursor:default;
  }
  .tool-card.placeholder:hover{transform:none;border-color:var(--border);}
  .tool-card.placeholder .avatar{background:var(--surface-sunken);font-size:20px;}

  .hero{margin-bottom:26px;}
  .hero p{margin:6px 0 0;color:var(--ink-secondary);font-size:13.5px;max-width:46ch;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>🎓 Tutor</h1>
      <p>Probabilidad y Estadística · 4to semestre</p>
    </div>
    <div class="header-right">
      <button class="theme-toggle" id="btnTheme" type="button" aria-label="Cambiar tema claro/oscuro" title="Cambiar tema">🌙</button>
    </div>
  </header>

  <div class="grid" id="grid"></div>

  <footer>Elegí una herramienta para empezar.</footer>
</div>

<script>
/* Cada herramienta nueva se agrega acá: icono, nombre, descripción, link, estado y color de avatar (c1-c4). */
const HERRAMIENTAS = [
  {
    icono: '📊',
    nombre: 'Tablas de Frecuencia',
    descripcion: 'Cargá tus datos y calculá fi, hi, hi%, Fi, Hi%, con gráficas de barras, histograma o pastel.',
    href: 'tablas_frecuencia.html',
    estado: 'disponible',
    color: 'c1'
  },
  {
    icono: '📅',
    nombre: 'Calendario',
    descripcion: 'Entregas y parciales del calendario UAN, más reuniones relevantes que se agreguen a mano.',
    href: 'calendario.html',
    estado: 'disponible',
    color: 'c2'
  },
  {
    icono: '📧',
    nombre: 'Correos importantes',
    descripcion: 'Los correos que vayas marcando como importantes en el chat, todos en un solo lugar.',
    href: 'correos.html',
    estado: 'disponible',
    color: 'c3'
  }
];

const grid = document.getElementById('grid');

HERRAMIENTAS.forEach((h, i) => {
  const a = document.createElement('a');
  a.className = 'tool-card enter';
  a.style.animationDelay = (i * 60) + 'ms';
  a.href = h.href;

  const avatar = document.createElement('div');
  avatar.className = 'avatar ' + h.color;
  avatar.textContent = h.icono;

  const title = document.createElement('h2');
  title.textContent = h.nombre;

  const desc = document.createElement('p');
  desc.textContent = h.descripcion;

  const status = document.createElement('span');
  status.className = 'status ' + h.estado;
  status.textContent = h.estado === 'disponible' ? 'Disponible' : 'Próximamente';

  a.append(avatar, title, desc, status);
  grid.appendChild(a);
});

const placeholder = document.createElement('div');
placeholder.className = 'tool-card placeholder enter';
placeholder.style.animationDelay = (HERRAMIENTAS.length * 60) + 'ms';
const pAvatar = document.createElement('div');
pAvatar.className = 'avatar';
pAvatar.textContent = '➕';
const pText = document.createElement('p');
pText.textContent = 'Acá van a aparecer nuevas herramientas a medida que se agreguen.';
placeholder.append(pAvatar, pText);
grid.appendChild(placeholder);

/* ---------- Tema claro / oscuro ---------- */
const rootEl = document.documentElement;

function tema() {
  return rootEl.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
}
function aplicarTema(t) {
  rootEl.setAttribute('data-theme', t);
  document.getElementById('btnTheme').textContent = t === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('tf_theme', t);
}
(function initTema() {
  const guardado = localStorage.getItem('tf_theme');
  const preferido = guardado || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  aplicarTema(preferido);
})();
document.getElementById('btnTheme').addEventListener('click', () => {
  aplicarTema(tema() === 'dark' ? 'light' : 'dark');
});
</script>
</body>
</html>
