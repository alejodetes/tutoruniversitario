<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tutor — Probabilidad y Estadística</title>
<link rel="stylesheet" href="assets/theme.css">
<style>
  .grid{
    display:grid;
    grid-template-columns: 1fr;
    gap:16px;
  }
  @media (min-width:560px){ .grid{grid-template-columns: repeat(2, 1fr);} }
  @media (min-width:900px){ .grid{grid-template-columns: repeat(3, 1fr);} }
  @media (min-width:1180px){ .grid{grid-template-columns: repeat(4, 1fr);} }

  .tool-card{
    position:relative;
    background:var(--surface-card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow: var(--shadow);
    text-decoration:none;
    color:inherit;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    transition: transform .22s cubic-bezier(.16,1,.3,1), box-shadow .22s ease, border-color .22s ease;
  }
  .tool-card:hover{transform:translateY(-4px) scale(1.01);border-color:var(--accent);}
  .tool-card:hover .cover .icon{transform:scale(1.08) rotate(-4deg);}
  .tool-card:active{transform:translateY(-1px) scale(.995);}

  .cover{
    position:relative;
    height:108px;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    flex-shrink:0;
  }
  .cover.c1{background:linear-gradient(135deg,#3f7fe0,#294f9c);}
  .cover.c2{background:linear-gradient(135deg,#ea7c40,#a94e1d);}
  .cover.c3{background:linear-gradient(135deg,#22b686,#12744f);}
  .cover.c4{background:linear-gradient(135deg,#eea968,#b56a29);}
  .cover::before{
    content:'';
    position:absolute;
    width:130px;height:130px;
    border-radius:50%;
    background:rgba(255,255,255,.15);
    filter:blur(2px);
    right:-38px;top:-46px;
  }
  .cover::after{
    content:'';
    position:absolute;
    width:70px;height:70px;
    border-radius:50%;
    background:rgba(0,0,0,.10);
    left:-20px;bottom:-30px;
  }
  .cover .icon{
    font-size:38px;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.3));
    transition: transform .25s cubic-bezier(.16,1,.3,1);
    position:relative;
    z-index:1;
  }

  .body{padding:34px 20px 20px;display:flex;flex-direction:column;gap:7px;flex:1;}
  .tool-card h2{font-size:16px;margin:0;font-weight:800;letter-spacing:-.005em;}
  .tool-card p{margin:0;font-size:13.5px;color:var(--ink-secondary);line-height:1.5;flex-grow:1;}
  .status{
    position:absolute;
    right:16px;
    top:108px;
    transform:translateY(-50%);
    font-size:11px;
    font-weight:700;
    letter-spacing:.03em;
    text-transform:uppercase;
    padding:5px 11px;
    border-radius:999px;
    box-shadow:0 6px 14px -4px rgba(0,0,0,.4);
    z-index:2;
  }
  .status.disponible{background:var(--accent);color:var(--accent-ink);}
  .status.proximamente{background:var(--surface-raised);color:var(--ink-muted);}

  .tool-card.placeholder{
    border-style:dashed;
    box-shadow:none;
    color:var(--ink-muted);
    cursor:default;
  }
  .tool-card.placeholder:hover{transform:none;border-color:var(--border);}
  .tool-card.placeholder .cover{background:var(--surface-sunken);}
  .tool-card.placeholder .cover::before, .tool-card.placeholder .cover::after{display:none;}
  .tool-card.placeholder .cover .icon{font-size:26px;filter:none;opacity:.7;}
  .tool-card.placeholder .body{padding-top:20px;text-align:center;}

  .hero{margin-bottom:26px;}
  .hero p{margin:6px 0 0;color:var(--ink-secondary);font-size:13.5px;max-width:46ch;}

  .revisiones{
    display:flex;
    justify-content:flex-end;
    flex-wrap:wrap;
    gap:8px;
    margin-top:18px;
  }
  .revisiones a{text-decoration:none;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>🎓 Tutor</h1>
      <p>Tu asistente académico</p>
    </div>
    <div class="header-right">
      <button class="theme-toggle" id="btnTheme" type="button" aria-label="Cambiar tema claro/oscuro" title="Cambiar tema">🌙</button>
    </div>
  </header>

  <div class="grid" id="grid"></div>

  <div class="revisiones">
    <a href="calendario.html"><span class="check-badge">📅 Calendario · Revisado <b>10 ago 2026</b></span></a>
    <a href="correos.html"><span class="check-badge">📧 Correos · Revisado <b>10 ago 2026</b></span></a>
  </div>

  <footer>Elegí una herramienta para empezar.</footer>
</div>

<script>
/* Cada herramienta nueva se agrega acá: icono, nombre, descripción, link, estado y color de avatar (c1-c4). */
const HERRAMIENTAS = [
  {
    icono: '📊',
    nombre: 'Tablas de Frecuencia',
    descripcion: 'Cargá tus datos y calculá fi, hi, hi%, Fi, Hi%, con gráficas de barras, histograma o pastel.',
    href: 'tablas_frecuencia.html',
    estado: 'disponible',
    color: 'c1'
  },
  {
    icono: '📅',
    nombre: 'Calendario',
    descripcion: 'Entregas y parciales del calendario UAN, más reuniones relevantes que se agreguen a mano.',
    href: 'calendario.html',
    estado: 'disponible',
    color: 'c2'
  },
  {
    icono: '📧',
    nombre: 'Correos importantes',
    descripcion: 'Los correos que vayas marcando como importantes en el chat, todos en un solo lugar.',
    href: 'correos.html',
    estado: 'disponible',
    color: 'c3'
  }
];

const grid = document.getElementById('grid');

HERRAMIENTAS.forEach((h, i) => {
  const a = document.createElement('a');
  a.className = 'tool-card enter';
  a.style.animationDelay = (i * 60) + 'ms';
  a.href = h.href;

  const cover = document.createElement('div');
  cover.className = 'cover ' + h.color;
  const icon = document.createElement('span');
  icon.className = 'icon';
  icon.textContent = h.icono;
  cover.appendChild(icon);

  const status = document.createElement('span');
  status.className = 'status ' + h.estado;
  status.textContent = h.estado === 'disponible' ? 'Disponible' : 'Próximamente';

  const body = document.createElement('div');
  body.className = 'body';
  const title = document.createElement('h2');
  title.textContent = h.nombre;
  const desc = document.createElement('p');
  desc.textContent = h.descripcion;
  body.append(title, desc);

  a.append(cover, status, body);
  grid.appendChild(a);
});

const placeholder = document.createElement('div');
placeholder.className = 'tool-card placeholder enter';
placeholder.style.animationDelay = (HERRAMIENTAS.length * 60) + 'ms';
const pCover = document.createElement('div');
pCover.className = 'cover';
const pIcon = document.createElement('span');
pIcon.className = 'icon';
pIcon.textContent = '➕';
pCover.appendChild(pIcon);
const pBody = document.createElement('div');
pBody.className = 'body';
const pText = document.createElement('p');
pText.textContent = 'Acá van a aparecer nuevas herramientas a medida que se agreguen.';
pBody.appendChild(pText);
placeholder.append(pCover, pBody);
grid.appendChild(placeholder);

/* ---------- Tema claro / oscuro ---------- */
const rootEl = document.documentElement;

function tema() {
  return rootEl.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
}
function aplicarTema(t) {
  rootEl.setAttribute('data-theme', t);
  document.getElementById('btnTheme').textContent = t === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('tf_theme', t);
}
(function initTema() {
  const guardado = localStorage.getItem('tf_theme');
  const preferido = guardado || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  aplicarTema(preferido);
})();
document.getElementById('btnTheme').addEventListener('click', () => {
  aplicarTema(tema() === 'dark' ? 'light' : 'dark');
});
</script>
</body>
</html>
